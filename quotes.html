  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page-holder">
      <header class="site-header">
        <nav class="site-nav" aria-label="Main">
          <div class="container">
            <a class="site-nav-brand" href="/">
              <img src="https://github.com/henriquealho.png?size=64" alt="" width="32" height="32" />

        <div class="site-context">
          <div class="container">
            <p class="site-context-text">Programming quotes to inspire your next idea.</p>
          </div>
        </div>
      </header>

      <main id="main" class="page-main quotes-page">
        <div class="container">
          <h1 class="sr-only">Programming Quotes</h1>
          <section class="quotes-card" aria-labelledby="quote-text" aria-busy="true">
            <span class="quotes-mark" aria-hidden="true">&ldquo;</span>
            <blockquote class="quotes-content" aria-live="polite" aria-atomic="true">
              <p id="quote-text" class="quotes-text is-loading">
                <span class="loading-state loading-state-inline" role="status">
                  <i class="fa fa-lightbulb-o loading-bulb" aria-hidden="true"></i>
                  <span>Finding a quote…</span>
                </span>
              </p>
              <footer id="quote-author" class="quotes-author"></footer>
            </blockquote>
            <div class="quotes-divider" aria-hidden="true"></div>
            <div class="quotes-actions" aria-label="Quote controls">
              <button id="previous-quote" class="quote-action" type="button" hidden>
                <span class="fa fa-chevron-left" aria-hidden="true"></span>
                Previous
              </button>
              <button id="next-quote" class="quote-action" type="button" disabled>
                Next
                <span class="fa fa-chevron-right" aria-hidden="true"></span>
              </button>
              <button id="random-quote" class="quote-action" type="button" disabled>
                <span class="fa fa-random" aria-hidden="true"></span>
                Random
              </button>
              <button id="copy-quote" class="quote-action" type="button" disabled>
                <span class="fa fa-copy" aria-hidden="true"></span>
                Copy
              </button>
              <span id="quote-counter" class="quotes-counter" aria-live="polite"></span>
            </div>
          </section>
          <p id="quote-feedback" class="quotes-feedback" role="status" aria-live="polite"></p>
          <noscript>
            <p class="quotes-feedback">Enable JavaScript to browse the programming quotes.</p>
          </noscript>
        </div>
      </main>
    </div>
